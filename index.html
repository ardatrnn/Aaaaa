                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        this.x + this.size / 2, this.y + topCurveHeight
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ctx.bezierCurveTo(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  this.x + this.size / 2, this.y, 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      this.x, this.y, 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          this.x, this.y + topCurveHeight
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ctx.fill();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ctx.globalAlpha = 1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  Heart.prototype.update = function() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    this.y += this.speed;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      this.x += Math.sin(this.y * 0.01) * 0.5; // Hafif salınım
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function animate() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // Arka plan yıldızları (Basit efekt)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if(!raining && Math.random() < 0.05) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   // Yıldız efekti eklenebilir ama sade tuttum
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       if (raining) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           if (hearts.length < 150) hearts.push(new Heart());
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               hearts.forEach((h, i) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     h.update();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           h.draw();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 if (h.y > canvas.height) hearts.splice(i, 1);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           requestAnimationFrame(animate);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           function startRain() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             raining = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             animate();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             </html>
