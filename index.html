<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sana Özel</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
/* --- Temel Ayarlar --- */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body, html { height: 100%; overflow: hidden; font-family: 'Poppins', sans-serif; background: #0f0c29; background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e); color: white; display: flex; justify-content: center; align-items: center; perspective: 1000px; }

canvas { position: fixed; top: 0; left: 0; z-index: 0; pointer-events: none; }

/* --- Zarf Yapısı (Envelope) --- */
.envelope-wrapper {
  position: relative;
    width: 300px;
      height: 200px;
        cursor: pointer;
          z-index: 5;
            transition: transform 0.6s ease;
            }

            .envelope-wrapper:hover { transform: scale(1.02); }
            .envelope-wrapper.open { cursor: default; }

            .envelope {
              position: relative;
                width: 100%;
                  height: 100%;
                    background: #c0392b;
                      border-radius: 0 0 10px 10px;
                        box-shadow: 0 15px 30px rgba(0,0,0,0.6);
                          z-index: 2;
                            overflow: visible;
                            }

                            /* Zarf Kapakları */
                            .flap {
                              position: absolute;
                                width: 0;
                                  height: 0;
                                    border-style: solid;
                                    }

                                    /* Üst Kapak (Hareketli) */
                                    .flap.top {
                                      top: 0;
                                        left: 0;
                                          border-width: 110px 150px 0 150px;
                                            border-color: #d6473b transparent transparent transparent;
                                              transform-origin: top;
                                                transition: transform 0.6s 0.2s ease-in-out, z-index 0.2s 0.4s;
                                                  z-index: 5;
                                                  }

                                                  /* Sağ ve Sol Kapaklar */
                                                  .flap.right {
                                                    top: 0;
                                                      right: 0;
                                                        border-width: 100px 150px 100px 0;
                                                          border-color: transparent #a93226 transparent transparent;
                                                            z-index: 3;
                                                            }
                                                            .flap.left {
                                                              top: 0;
                                                                left: 0;
                                                                  border-width: 100px 0 100px 150px;
                                                                    border-color: transparent transparent transparent #a93226;
                                                                      z-index: 3;
                                                                      }

                                                                      /* Alt Kapak */
                                                                      .flap.bottom {
                                                                        bottom: 0;
                                                                          left: 0;
                                                                            border-width: 0 150px 110px 150px;
                                                                              border-color: transparent transparent #c0392b transparent;
                                                                                border-radius: 0 0 10px 10px;
                                                                                  z-index: 4;
                                                                                  }

                                                                                  /* Mühür (Kalp) */
                                                                                  .heart-seal {
                                                                                    position: absolute;
                                                                                      top: 50%; /* Zarfın ortasına hizala */
                                                                                        left: 50%;
                                                                                          transform: translate(-50%, -50%);
                                                                                            width: 40px;
                                                                                              height: 40px;
                                                                                                background: #e74c3c;
                                                                                                  border: 2px solid #922b21;
                                                                                                    border-radius: 50%;
                                                                                                      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
                                                                                                        z-index: 6;
                                                                                                          display: flex;
                                                                                                            justify-content: center;
                                                                                                              align-items: center;
                                                                                                                font-size: 20px;
                                                                                                                  color: #fff;
                                                                                                                    transition: opacity 0.4s ease;
                                                                                                                    }

                                                                                                                    /* --- Mektup (Letter) --- */
                                                                                                                    .letter {
                                                                                                                      position: absolute;
                                                                                                                        bottom: 0;
                                                                                                                          left: 50%;
                                                                                                                            transform: translateX(-50%);
                                                                                                                              width: 90%;
                                                                                                                                height: 90%;
                                                                                                                                  background: #fffdf0; /* Kağıt rengi */
                                                                                                                                    border-radius: 5px;
                                                                                                                                      z-index: 1; /* Zarfın içinde */
                                                                                                                                        transition: bottom 0.8s 0.8s ease-in-out, transform 0.8s 1.5s ease, z-index 0.1s 1.5s;
                                                                                                                                          padding: 20px;
                                                                                                                                            text-align: center;
                                                                                                                                              box-shadow: 0 5px 15px rgba(0,0,0,0.2);
                                                                                                                                                display: flex;
                                                                                                                                                  flex-direction: column;
                                                                                                                                                    justify-content: center;
                                                                                                                                                      align-items: center;
                                                                                                                                                        overflow: hidden;
                                                                                                                                                        }

                                                                                                                                                        .letter-content {
                                                                                                                                                          opacity: 0;
                                                                                                                                                            transform: translateY(20px);
                                                                                                                                                              transition: opacity 1s 2s ease, transform 1s 2s ease;
                                                                                                                                                                width: 100%;
                                                                                                                                                                }

                                                                                                                                                                .letter h2 {
                                                                                                                                                                  font-family: 'Great Vibes', cursive;
                                                                                                                                                                    color: #c0392b;
                                                                                                                                                                      font-size: 2rem;
                                                                                                                                                                        margin-bottom: 10px;
                                                                                                                                                                        }

                                                                                                                                                                        .letter p {
                                                                                                                                                                          font-size: 0.9rem;
                                                                                                                                                                            color: #333;
                                                                                                                                                                              line-height: 1.5;
                                                                                                                                                                                margin-bottom: 20px;
                                                                                                                                                                                  font-weight: 500;
                                                                                                                                                                                  }

                                                                                                                                                                                  /* Buton ve Damga */
                                                                                                                                                                                  .btn-group { margin-top: 15px; }

                                                                                                                                                                                  .yes-btn {
                                                                                                                                                                                    background: #c0392b;
                                                                                                                                                                                      color: white;
                                                                                                                                                                                        border: none;
                                                                                                                                                                                          padding: 10px 30px;
                                                                                                                                                                                            border-radius: 25px;
                                                                                                                                                                                              font-size: 1rem;
                                                                                                                                                                                                font-family: 'Poppins', sans-serif;
                                                                                                                                                                                                  cursor: pointer;
                                                                                                                                                                                                    box-shadow: 0 4px 10px rgba(192, 57, 43, 0.4);
                                                                                                                                                                                                      transition: transform 0.2s;
                                                                                                                                                                                                      }

                                                                                                                                                                                                      .yes-btn:active { transform: scale(0.95); }

                                                                                                                                                                                                      .stamp {
                                                                                                                                                                                                        position: absolute;
                                                                                                                                                                                                          top: 50%;
                                                                                                                                                                                                            left: 50%;
                                                                                                                                                                                                              transform: translate(-50%, -50%) scale(3);
                                                                                                                                                                                                                font-size: 3rem;
                                                                                                                                                                                                                  font-weight: bold;
                                                                                                                                                                                                                    color: #c0392b;
                                                                                                                                                                                                                      border: 4px solid #c0392b;
                                                                                                                                                                                                                        padding: 10px 20px;
                                                                                                                                                                                                                          border-radius: 10px;
                                                                                                                                                                                                                            opacity: 0;
                                                                                                                                                                                                                              pointer-events: none;
                                                                                                                                                                                                                                font-family: 'Courier New', Courier, monospace;
                                                                                                                                                                                                                                  text-transform: uppercase;
                                                                                                                                                                                                                                    z-index: 10;
                                                                                                                                                                                                                                      background: rgba(255,255,255,0.8);
                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                      .stamp.visible {
                                                                                                                                                                                                                                        animation: stampIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                        @keyframes stampIn {
                                                                                                                                                                                                                                          to { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-15deg); }
                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                          /* --- Animasyon Durumları (JavaScript ile tetiklenir) --- */

                                                                                                                                                                                                                                          /* 1. Zarf Kapağını Aç */
                                                                                                                                                                                                                                          .envelope-wrapper.open .flap.top {
                                                                                                                                                                                                                                            transform: rotateX(180deg);
                                                                                                                                                                                                                                              z-index: 1; /* Arkaya geç */
                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                              /* 2. Mühürü Gizle */
                                                                                                                                                                                                                                              .envelope-wrapper.open .heart-seal {
                                                                                                                                                                                                                                                opacity: 0;
                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                /* 3. Mektubu Yukarı Çıkar ve Büyüt */
                                                                                                                                                                                                                                                .envelope-wrapper.open .letter {
                                                                                                                                                                                                                                                  bottom: 100px; /* Zarfın üstüne çık */
                                                                                                                                                                                                                                                    z-index: 10; /* En öne geç */
                                                                                                                                                                                                                                                      transform: translateX(-50%) scale(1.3); /* Biraz büyüt */
                                                                                                                                                                                                                                                        height: auto;
                                                                                                                                                                                                                                                          min-height: 250px;
                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                          /* 4. İçeriği Göster */
                                                                                                                                                                                                                                                          .envelope-wrapper.open .letter-content {
                                                                                                                                                                                                                                                            opacity: 1;
                                                                                                                                                                                                                                                              transform: translateY(0);
                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                              /* Mobilde mektup boyutunu ayarla */
                                                                                                                                                                                                                                                              @media (max-width: 480px) {
                                                                                                                                                                                                                                                                .envelope-wrapper.open .letter {
                                                                                                                                                                                                                                                                    transform: translateX(-50%) scale(1.1);
                                                                                                                                                                                                                                                                        width: 95%;
                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                          /* Başlangıç Yazısı */
                                                                                                                                                                                                                                                                          .hint-text {
                                                                                                                                                                                                                                                                            position: absolute;
                                                                                                                                                                                                                                                                              bottom: -40px;
                                                                                                                                                                                                                                                                                width: 100%;
                                                                                                                                                                                                                                                                                  text-align: center;
                                                                                                                                                                                                                                                                                    font-size: 0.9rem;
                                                                                                                                                                                                                                                                                      opacity: 0.8;
                                                                                                                                                                                                                                                                                        animation: pulse 2s infinite;
                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

                                                                                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                                                                                        </head>
                                                                                                                                                                                                                                                                                        <body>

                                                                                                                                                                                                                                                                                        <canvas id="bg"></canvas>

                                                                                                                                                                                                                                                                                        <div class="envelope-wrapper" id="envelopeWrapper">
                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                            <div class="envelope">
                                                                                                                                                                                                                                                                                                <div class="letter">
                                                                                                                                                                                                                                                                                                      <div class="letter-content">
                                                                                                                                                                                                                                                                                                              <h2>Sevgilim...</h2>
                                                                                                                                                                                                                                                                                                                      <p>Seninle geçen her an benim hayatımın en güzel anları.<br><br>
                                                                                                                                                                                                                                                                                                                              Hayatıma kattığın renk ve anlam için teşekkür ederim.</p>
                                                                                                                                                                                                                                                                                                                                      <p style="font-weight: 600; color: #c0392b;">Benimle bir ömür Sevgililer Günü yaşar mısın?</p>
                                                                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                                                                                      <div class="btn-group">
                                                                                                                                                                                                                                                                                                                                                                <button class="yes-btn" onclick="sayYes(event)">Evet ❤️</button>
                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                        <div class="stamp" id="stamp">EVET!</div>
                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                      <div class="flap left"></div>
                                                                                                                                                                                                                                                                                                                                                                                                          <div class="flap right"></div>
                                                                                                                                                                                                                                                                                                                                                                                                              <div class="flap bottom"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="flap top"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="heart-seal">❤</div>
                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="hint-text" id="hint">Mektubu açmak için tıkla</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                // --- Zarf Açma Mantığı ---
                                                                                                                                                                                                                                                                                                                                                                                                                                const wrapper = document.getElementById('envelopeWrapper');
                                                                                                                                                                                                                                                                                                                                                                                                                                const hint = document.getElementById('hint');
                                                                                                                                                                                                                                                                                                                                                                                                                                let isOpen = false;

                                                                                                                                                                                                                                                                                                                                                                                                                                wrapper.addEventListener('click', function() {
                                                                                                                                                                                                                                                                                                                                                                                                                                  if (!isOpen) {
                                                                                                                                                                                                                                                                                                                                                                                                                                      wrapper.classList.add('open');
                                                                                                                                                                                                                                                                                                                                                                                                                                          hint.style.display = 'none';
                                                                                                                                                                                                                                                                                                                                                                                                                                              isOpen = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                });

                                                                                                                                                                                                                                                                                                                                                                                                                                                // --- Evet Butonu Mantığı ---
                                                                                                                                                                                                                                                                                                                                                                                                                                                function sayYes(e) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                  e.stopPropagation(); // Mektuba tıklamayı engelle
                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                      const stamp = document.getElementById('stamp');
                                                                                                                                                                                                                                                                                                                                                                                                                                                        stamp.classList.add('visible');
                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                            // Kalp yağmurunu başlat
                                                                                                                                                                                                                                                                                                                                                                                                                                                              startRain();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  // Titreşim (Mobil için)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // --- Kalp Yağmuru Animasyonu (Canvas) ---
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const canvas = document.getElementById('bg');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const ctx = canvas.getContext('2d');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let hearts = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let raining = false;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function resize() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      canvas.width = window.innerWidth;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        canvas.height = window.innerHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        resize();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        window.addEventListener('resize', resize);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function Heart() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          this.x = Math.random() * canvas.width;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            this.y = -20;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              this.size = Math.random() * 10 + 5;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                this.speed = Math.random() * 3 + 2;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  this.opacity = Math.random() * 0.5 + 0.3;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    this.color = `hsl(${Math.random() * 60 + 320}, 100%, 60%)`; // Pembe/Kırmızı tonları
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    Heart.prototype.draw = function() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ctx.globalAlpha = this.opacity;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ctx.fillStyle = this.color;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ctx.beginPath();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let topCurveHeight = this.size * 0.3;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ctx.moveTo(this.x, this.y + topCurveHeight);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  // Sol tepe
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.bezierCurveTo(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        this.x, this.y, 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            this.x - this.size / 2, this.y, 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                this.x - this.size / 2, this.y + topCurveHeight
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      // Alt uç
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ctx.bezierCurveTo(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            this.x - this.size / 2, this.y + (this.size + topCurveHeight) / 2, 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                this.x, this.y + (this.size + topCurveHeight), 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    this.x, this.y + this.size
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          // Sağ taraf (ayna görüntüsü)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.bezierCurveTo(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                this.x, this.y + (this.size + topCurveHeight), 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    this.x + this.size / 2, this.y + (this.size + topCurveHeight) / 2,
